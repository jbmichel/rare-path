[project]
name = "rarepath"
version = "0.1.0"
description = "Multi-agent therapeutic-development decision system for rare diseases"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.11", "claude-agent-sdk>=0.2", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
rarepath = "rarepath.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rarepath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
