[project]
name = "asopath"
version = "0.2.0"
description = "ASO discovery agent"
requires-python = ">=3.10"
dependencies = ["claude-agent-sdk>=0.2", "pydantic>=2"]

[project.scripts]
asopath = "asopath.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asopath"]
